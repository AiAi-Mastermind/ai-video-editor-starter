# Codex settings for this folder.
# Setup registers HeyGen for you by running scripts/bootstrap.sh. You never click a plugin.
# HyperFrames is the hyperframes command plus the instructions that bootstrap installs.
# Speech uses scripts/elevenlabs-speak.sh and the private key in .env.
# The elevenlabs command handles sound effects, music and transcription from the same key.
# Start a new chat after setup finishes. No key is stored in this file.

[mcp_servers.heygen]
# Your HeyGen video clone. Sign in once with: codex mcp login heygen
url = "https://mcp.heygen.com/mcp/v1/"
